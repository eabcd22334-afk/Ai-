<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nyx AI</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        body { background: #0d0614; color: #fff; font-family: system-ui, sans-serif; }
        .chat-ai { background: linear-gradient(135deg, #2b1055 0%, #7597de 100%); }
        .chat-user { background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%); }
    </style>
</head>
<body class="flex flex-col h-screen justify-between">
    <header class="p-4 border-b border-gray-800 flex items-center space-x-3">
        <div class="w-10 h-10 rounded-full bg-blue-600 flex items-center justify-center font-bold">N</div>
        <div>
            <h1 class="font-bold">Nyx AI</h1>
            <p class="text-xs text-green-400">● অনলাইন</p>
        </div>
    </header>

    <div id="chat-box" class="flex-1 overflow-y-auto p-4 space-y-4">
        <div class="flex items-start space-x-2">
            <div class="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center font-bold text-xs">N</div>
            <div class="chat-ai p-3 rounded-2xl max-w-xs text-sm">হ্যালো! আমি Nyx AI। আপনাকে কীভাবে সাহায্য করতে পারি?</div>
        </div>
    </div>

    <div class="p-4 border-t border-gray-800">
        <div class="flex items-center bg-gray-900 border border-gray-700 rounded-full px-4 py-2">
            <input type="text" id="user-input" placeholder="এআই-কে কিছু জিজ্ঞেস করুন..." class="flex-1 bg-transparent outline-none text-sm text-white">
            <button onclick="sendMsg()" class="bg-blue-600 p-2 rounded-full text-white">
                <svg class="h-4 w-4 transform rotate-45" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
                </svg>
            </button>
        </div>
    </div>

    <script>
        const workerUrl = 'https://nyx-ai-core.eabcd22334.workers.dev';

        async function sendMsg() {
            const input = document.getElementById('user-input');
            const chatBox = document.getElementById('chat-box');
            const txt = input.value.trim();
            if (!txt) return;

            // ইউজার চ্যাট
            chatBox.innerHTML += `<div class="flex justify-end"><div class="chat-user p-3 rounded-2xl max-w-xs text-sm">${escapeHtml(txt)}</div></div>`;
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            // টাইপিং লোডার
            const loadId = 'load-' + Date.now();
            chatBox.innerHTML += `<div id="${loadId}" class="flex space-x-2"><div class="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center font-bold text-xs">N</div><div class="chat-ai p-3 rounded-2xl text-sm animate-pulse">টাইপ করছে...</div></div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const res = await fetch(workerUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: txt })
                });

                const data = await res.json();
                document.getElementById(loadId)?.remove();

                if (res.ok && data.reply) {
                    chatBox.innerHTML += `<div class="flex space-x-2"><div class="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center font-bold text-xs">N</div><div class="chat-ai p-3 rounded-2xl max-w-xs text-sm">${escapeHtml(data.reply)}</div></div>`;
                } else {
                    showError(data.error || 'অজানা কোনো এরর হয়েছে।');
                }
            } catch (err) {
                document.getElementById(loadId)?.remove();
                showError('নেটওয়ার্ক/CORS এরর: ' + err.message);
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function showError(msg) {
            const chatBox = document.getElementById('chat-box');
            chatBox.innerHTML += `<div class="flex space-x-2"><div class="w-8 h-8 rounded-full bg-red-600 flex items-center justify-center font-bold text-xs">N</div><div class="bg-red-950 border border-red-700 text-red-200 p-3 rounded-2xl max-w-xs text-sm">এরর: ${escapeHtml(msg)}</div></div>`;
        }

        function escapeHtml(t) { return t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
        document.getElementById('user-input').addEventListener('keypress', e => { if (e.key === 'Enter') sendMsg(); });
    </script>
</body>
</html>
