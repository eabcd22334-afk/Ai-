<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nyx AI — আপনার নিজের এআই</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07060d; --panel:rgba(255,255,255,.045); --line:rgba(255,255,255,.09);
  --text:#ecebf5; --mute:#8b88a3; --a1:#8b5cf6; --a2:#22d3ee; --a3:#f472b6;
  --grad:linear-gradient(135deg,var(--a1),var(--a2));
}
:root[data-theme="light"]{
  --bg:#f3f2fa; --panel:rgba(255,255,255,.7); --line:rgba(20,10,60,.1);
  --text:#17142b; --mute:#6b6885;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{
  font-family:'Hind Siliguri','Noto Sans Bengali',system-ui,sans-serif;
  background:var(--bg);color:var(--text);overflow:hidden;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);
}
.orb{position:fixed;border-radius:50%;filter:blur(90px);opacity:.35;pointer-events:none;z-index:0}
.o1{width:380px;height:380px;background:var(--a1);top:-120px;left:-100px;animation:drift 18s ease-in-out infinite alternate}
.o2{width:320px;height:320px;background:var(--a2);bottom:-120px;right:-80px;animation:drift 22s ease-in-out infinite alternate-reverse}
.o3{width:220px;height:220px;background:var(--a3);top:45%;left:55%;opacity:.18;animation:drift 26s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(60px,40px) scale(1.15)}}

.app{position:relative;z-index:1;max-width:860px;height:100%;margin:0 auto;display:flex;flex-direction:column;padding:0 14px}
header{display:flex;align-items:center;gap:12px;padding:16px 4px 12px}
.logo{width:42px;height:42px;border-radius:14px;background:var(--grad);display:grid;place-items:center;
  font:700 20px 'Space Grotesk',sans-serif;color:#fff;box-shadow:0 8px 28px -6px var(--a1)}
.title{flex:1}
.title h1{font:700 18px 'Space Grotesk','Hind Siliguri',sans-serif;letter-spacing:.2px}
.status{font-size:12.5px;color:var(--mute);display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:#34d399;box-shadow:0 0 0 0 #34d39988;animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
.icon-btn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--panel);
  color:var(--text);cursor:pointer;font-size:16px;backdrop-filter:blur(12px);transition:transform .15s,border-color .15s}
.icon-btn:hover{border-color:var(--a1);transform:translateY(-1px)}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--a2);outline-offset:2px}

#chat{flex:1;overflow-y:auto;padding:8px 2px 16px;scroll-behavior:smooth}
#chat::-webkit-scrollbar{width:6px}#chat::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px}

.welcome{text-align:center;padding:9vh 10px 0}
.welcome h2{font:700 clamp(26px,5vw,38px)/1.25 'Hind Siliguri',sans-serif;
  background:linear-gradient(120deg,var(--text) 30%,var(--a2),var(--a1));-webkit-background-clip:text;background-clip:text;color:transparent}
.welcome p{color:var(--mute);margin:10px 0 26px;font-size:15.5px}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.chip{padding:10px 16px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--text);
  font:500 14px 'Hind Siliguri',sans-serif;cursor:pointer;backdrop-filter:blur(12px);transition:.2s}
.chip:hover{border-color:var(--a1);background:rgba(139,92,246,.14)}

.msg{display:flex;gap:10px;margin:14px 0;max-width:100%}
.msg.user{flex-direction:row-reverse}
.av{flex:none;width:32px;height:32px;border-radius:11px;display:grid;place-items:center;font:700 13px 'Space Grotesk',sans-serif;color:#fff;background:var(--grad)}
.msg.user .av{background:var(--panel);border:1px solid var(--line);color:var(--text)}
.bubble{position:relative;padding:12px 16px;border-radius:18px;line-height:1.7;font-size:15.5px;max-width:min(82%,640px);
  word-wrap:break-word;overflow-wrap:anywhere}
.msg.bot .bubble{background:var(--panel);border:1px solid var(--line);border-top-left-radius:6px;backdrop-filter:blur(14px)}
.msg.user .bubble{background:var(--grad);color:#fff;border-top-right-radius:6px;box-shadow:0 10px 30px -12px var(--a1)}
.bubble.err{border-color:#f8717199}
.bubble p{margin:0 0 .6em}.bubble p:last-child{margin:0}
.bubble code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13.5px;background:rgba(139,92,246,.18);padding:1px 6px;border-radius:6px}
.bubble pre{margin:.7em 0;background:#0b0a14;color:#e6e4f5;border:1px solid var(--line);border-radius:12px;overflow-x:auto;padding:14px;position:relative}
.bubble pre code{background:none;padding:0;color:inherit}
.copy{position:absolute;top:6px;right:6px;font:500 12px 'Hind Siliguri',sans-serif;padding:3px 9px;border-radius:8px;
  border:1px solid var(--line);background:rgba(255,255,255,.06);color:#cfcde6;cursor:pointer}
.tools{display:flex;gap:6px;margin-top:8px;opacity:0;transition:.2s}
.msg:hover .tools,.msg:focus-within .tools{opacity:1}
.tools button{font:500 12px 'Hind Siliguri',sans-serif;color:var(--mute);background:none;border:none;cursor:pointer;padding:2px 6px;border-radius:6px}
.tools button:hover{color:var(--text);background:var(--panel)}
@media (hover:none){.tools{opacity:1}}

.typing{display:flex;gap:5px;padding:6px 2px}
.typing i{width:8px;height:8px;border-radius:50%;background:var(--a2);animation:bounce 1.1s infinite}
.typing i:nth-child(2){animation-delay:.15s;background:var(--a1)}.typing i:nth-child(3){animation-delay:.3s;background:var(--a3)}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-6px);opacity:1}}

.composer{padding:8px 0 14px}
.box{display:flex;align-items:flex-end;gap:8px;padding:8px 8px 8px 16px;border-radius:22px;border:1px solid var(--line);
  background:var(--panel);backdrop-filter:blur(18px);transition:border-color .2s,box-shadow .2s}
.box:focus-within{border-color:var(--a1);box-shadow:0 0 0 4px rgba(139,92,246,.16)}
textarea{flex:1;resize:none;border:none;outline:none;background:none;color:var(--text);
  font:500 16px/1.6 'Hind Siliguri',sans-serif;max-height:160px;padding:7px 0}
textarea::placeholder{color:var(--mute)}
#send{width:44px;height:44px;flex:none;border:none;border-radius:15px;background:var(--grad);color:#fff;font-size:18px;
  cursor:pointer;transition:transform .15s,opacity .2s;box-shadow:0 8px 22px -8px var(--a1)}
#send:hover{transform:scale(1.06)}#send:disabled{opacity:.4;cursor:not-allowed;transform:none}
.hint{text-align:center;color:var(--mute);font-size:12px;margin-top:8px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}
@media (max-width:520px){.bubble{max-width:88%}}
</style>
</head>
<body>
<div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>

<div class="app">
  <header>
    <div class="logo">N</div>
    <div class="title"><h1>Nyx AI</h1><div class="status"><span class="dot"></span><span id="statusTxt">অনলাইন</span></div></div>
    <button class="icon-btn" id="themeBtn" title="থিম বদলান" aria-label="থিম বদলান">🌓</button>
    <button class="icon-btn" id="clearBtn" title="নতুন চ্যাট" aria-label="নতুন চ্যাট">🗑</button>
  </header>

  <main id="chat" aria-live="polite"></main>

  <div class="composer">
    <div class="box">
      <textarea id="userInput" rows="1" placeholder="এআই-কে কিছু জিজ্ঞেস করুন..." aria-label="আপনার বার্তা"></textarea>
      <button id="send" aria-label="পাঠান">➤</button>
    </div>
    <div class="hint">Enter চাপলে পাঠাবে · নতুন লাইনের জন্য Shift + Enter</div>
  </div>
</div>

<script>
// আপনার ক্লাউডফ্লায়ার ওয়ার্কারের লিংকটি এখানে বসানো হলো
const workerUrl = 'https://nyx-ai-core.eabcd22334.workers.dev';

const SUGGESTIONS = ['আমাকে একটি মজার গল্প বলো','জাভাস্ক্রিপ্টে একটি ক্যালকুলেটর লিখে দাও','ইংরেজি ইমেইল লেখা শেখাও','আজকের জন্য একটি প্রোডাক্টিভিটি টিপস দাও'];
const chat = document.getElementById('chat'), input = document.getElementById('userInput'), sendBtn = document.getElementById('send');
let history = [], busy = false;

try{ const t = localStorage.getItem('nyx-theme'); if(t) document.documentElement.dataset.theme = t; }catch(e){}

const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function md(text){
  const blocks = [];
  let s = esc(text).replace(/```(\w*)\n?([\s\S]*?)```/g, (_, l, c) => { blocks.push(c.replace(/\n$/,'')); return '\u0000' + (blocks.length-1) + '\u0000'; });
  s = s.replace(/`([^`\n]+)`/g,'<code>$1</code>')
       .replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>')
       .replace(/(^|\s)\*([^*\n]+)\*/g,'$1<em>$2</em>')
       .split(/\n{2,}/).map(p => '<p>' + p.replace(/\n/g,'<br>') + '</p>').join('');
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => '</p><pre><button class="copy" type="button">কপি</button><code>' + blocks[i] + '</code></pre><p>').replace(/<p><\/p>/g,'');
}
function scrollDown(){ chat.scrollTop = chat.scrollHeight; }

function welcome(){
  chat.innerHTML = '<div class="welcome"><h2>আজ কী জানতে চান?</h2><p>লিখুন, প্রশ্ন করুন, কোড চান — আমি এখানেই আছি।</p><div class="chips"></div></div>';
  const box = chat.querySelector('.chips');
  SUGGESTIONS.forEach(t => { const b = document.createElement('button'); b.className='chip'; b.textContent=t; b.onclick=()=>{input.value=t;askAI()}; box.appendChild(b); });
}

function addMsg(role, text, cls){
  chat.querySelector('.welcome')?.remove();
  const m = document.createElement('div'); m.className = 'msg ' + role;
  m.innerHTML = '<div class="av">' + (role==='bot'?'N':'আ') + '</div><div><div class="bubble ' + (cls||'') + '"></div></div>';
  const b = m.querySelector('.bubble');
  if(role==='user') b.textContent = text; else b.innerHTML = md(text);
  chat.appendChild(m); scrollDown();
  return {m, b};
}

function addTools(m, text){
  const t = document.createElement('div'); t.className='tools';
  t.innerHTML = '<button type="button" data-a="copy">কপি</button><button type="button" data-a="again">আবার বলো</button>';
  t.onclick = e => {
    const a = e.target.dataset.a;
    if(a==='copy'){ navigator.clipboard?.writeText(text); e.target.textContent='কপি হয়েছে ✓'; setTimeout(()=>e.target.textContent='কপি',1500); }
    if(a==='again'){ const last = [...history].reverse().find(h=>h.role==='user'); if(last && !busy){ input.value = last.text; askAI(); } }
  };
  m.lastElementChild.appendChild(t);
}

async function typewrite(el, text){
  const step = Math.max(2, Math.ceil(text.length/180));
  for(let i=step;i<text.length+step;i+=step){ el.innerHTML = md(text.slice(0,i)); scrollDown(); await new Promise(r=>setTimeout(r,14)); }
  el.innerHTML = md(text); scrollDown();
}

async function askAI(){
  const prompt = input.value.trim();
  if(!prompt || busy) return;
  busy = true; sendBtn.disabled = true; input.value = ''; resize();
  addMsg('user', prompt); history.push({role:'user', text:prompt});

  const {m, b} = addMsg('bot', '');
  b.innerHTML = '<div class="typing"><i></i><i></i><i></i></div>';
  document.getElementById('statusTxt').textContent = 'চিন্তা করছি...';

  try{
    const res = await fetch(WORKER_URL, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ prompt }) });
    const data = await res.json();
    const reply = data.reply || data.error || 'কোনো উত্তর পাওয়া যায়নি।';
    if(!data.reply) b.classList.add('err');
    await typewrite(b, reply);
    history.push({role:'bot', text:reply}); addTools(m, reply);
  }catch(err){
    b.classList.add('err'); b.innerHTML = md('সার্ভারের সাথে কানেক্ট করা যায়নি। ইন্টারনেট ও ওয়ার্কার লিংক চেক করে আবার চেষ্টা করুন।');
  }
  document.getElementById('statusTxt').textContent = 'অনলাইন';
  busy = false; sendBtn.disabled = false; input.focus();
}

function resize(){ input.style.height='auto'; input.style.height = Math.min(input.scrollHeight,160)+'px'; }
input.addEventListener('input', resize);
input.addEventListener('keydown', e => { if(e.key==='Enter' && !e.shiftKey && !e.isComposing){ e.preventDefault(); askAI(); } });
sendBtn.onclick = askAI;
document.getElementById('clearBtn').onclick = () => { if(busy) return; history = []; welcome(); };
document.getElementById('themeBtn').onclick = () => {
  const r = document.documentElement, n = r.dataset.theme === 'light' ? 'dark' : 'light'; r.dataset.theme = n;
  try{ localStorage.setItem('nyx-theme', n); }catch(e){}
};
chat.addEventListener('click', e => {
  if(e.target.classList.contains('copy')){ navigator.clipboard?.writeText(e.target.nextElementSibling.textContent); e.target.textContent='✓'; setTimeout(()=>e.target.textContent='কপি',1500); }
});
welcome();
</script>
</body>
</html>>
