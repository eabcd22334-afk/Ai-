<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nyx AI — আপনার নিজের এআই সহকারী</title>
    <!-- Tailwind CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        body {
            background: radial-gradient(circle at center, #1a0b2e 0%, #0d0614 100%);
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .chat-bubble-ai {
            background: linear-gradient(135deg, #2b1055 0%, #7597de 100%);
        }
        .chat-bubble-user {
            background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
        }
    </style>
</head>
<body class="flex flex-col h-screen justify-between">
    <!-- Header -->
    <header class="flex items-center justify-between p-4 border-b border-gray-800 bg-opacity-50 backdrop-blur-md">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-blue-500 to-indigo-600 flex items-center font-bold text-lg justify-center shadow-lg">N</div>
            <div>
                <h1 class="font-bold text-lg">Nyx AI</h1>
                <p class="text-xs text-green-400 flex items-center"><span class="w-2 h-2 bg-green-500 rounded-full inline-block mr-1"></span> অনলাইন</p>
            </div>
        </div>
    </header>

    <!-- Chat Container -->
    <div id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-4">
        <!-- Initial Greeting -->
        <div class="flex items-start space-x-2">
            <div class="w-8 h-8 rounded-full bg-blue-500 flex items-center justify-center font-bold text-sm">N</div>
            <div class="chat-bubble-ai p-3 rounded-2xl max-w-xs md:max-w-md text-sm shadow-md">
                হ্যালো! আমি Nyx AI। আজ আপনাকে কীভাবে সাহায্য করতে পারি?
            </div>
        </div>
    </div>

    <!-- Input Area -->
    <div class="p-4 border-t border-gray-800 bg-opacity-50 backdrop-blur-md">
        <div class="flex items-center space-x-2 bg-gray-900 border border-gray-700 rounded-full px-4 py-2 shadow-inner">
            <input type="text" id="user-input" placeholder="এআই-কে কিছু জিজ্ঞেস করুন..." class="flex-1 bg-transparent border-none outline-none text-white text-sm placeholder-gray-400">
            <button onclick="sendMessage()" class="bg-gradient-to-r from-blue-500 to-indigo-600 text-white p-2 rounded-full hover:opacity-90 transition shadow-md">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 transform rotate-45" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
                </svg>
            </button>
        </div>
    </div>

    <script>
        const workerUrl = 'https://nyx-ai-core.eabcd22334.workers.dev';

        async function sendMessage() {
            const inputField = document.getElementById('user-input');
            const chatContainer = document.getElementById('chat-container');
            const prompt = inputField.value.trim();

            if (!prompt) return;

            // ইউজার মেসজ যোগ করা
            const userMsgDiv = document.createElement('div');
            userMsgDiv.className = 'flex justify-end space-x-2';
            userMsgDiv.innerHTML = `
                <div class="chat-bubble-user p-3 rounded-2xl max-w-xs md:max-w-md text-sm shadow-md">
                    ${escapeHtml(prompt)}
                </div>
            `;
            chatContainer.appendChild(userMsgDiv);
            inputField.value = '';
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // লোডিং এলিমেন্ট তৈরি
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'flex items-start space-x-2';
            loadingDiv.innerHTML = `
                <div class="w-8 h-8 rounded-full bg-blue-500 flex items-center justify-center font-bold text-sm">N</div>
                <div class="chat-bubble-ai p-3 rounded-2xl text-sm shadow-md text-gray-300 animate-pulse">
                    টাইপ করছে...
                </div>
            `;
            chatContainer.appendChild(loadingDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                const response = await fetch(workerUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: prompt })
                });

                const data = await response.json();

                // লোডিং মেসেজ নিরাপদে মুছে ফেলা
                if (loadingDiv && loadingDiv.parentNode) {
                    loadingDiv.parentNode.removeChild(loadingDiv);
                }

                if (data.reply) {
                    const aiMsgDiv = document.createElement('div');
                    aiMsgDiv.className = 'flex items-start space-x-2';
                    aiMsgDiv.innerHTML = `
                        <div class="w-8 h-8 rounded-full bg-blue-500 flex items-center justify-center font-bold text-sm">N</div>
                        <div class="chat-bubble-ai p-3 rounded-2xl max-w-xs md:max-w-md text-sm shadow-md">
                            ${escapeHtml(data.reply)}
                        </div>
                    `;
                    chatContainer.appendChild(aiMsgDiv);
                } else {
                    throw new Error(data.error || 'রেসপন্স পাওয়া যায়নি।');
                }
            } catch (error) {
                if (loadingDiv && loadingDiv.parentNode) {
                    loadingDiv.parentNode.removeChild(loadingDiv);
                }
                const errorDiv = document.createElement('div');
                errorDiv.className = 'flex items-start space-x-2';
                errorDiv.innerHTML = `
                    <div class="w-8 h-8 rounded-full bg-red-500 flex items-center justify-center font-bold text-sm">N</div>
                    <div class="bg-red-900 bg-opacity-50 p-3 rounded-2xl max-w-xs md:max-w-md text-sm shadow-md text-red-200">
                        সার্ভারের সাথে কানেক্ট করা যায়নি। দয়া করে ইন্টারনেট ও লিঙ্ক চেক করুন।
                    </div>
                `;
                chatContainer.appendChild(errorDiv);
            }
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        document.getElementById('user-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>
</html>
